[package]
name = "oskl"
version = "0.1.0"
edition = "2024"
description = "A lightweight, git-first code editor for macOS"
license = "MIT"

[dependencies]
alacritty_terminal = "0.26"
# Databases: one background thread runs them all (tokio, current-thread); TLS is macOS's own
# except for MongoDB, whose driver only does rustls.
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "io-util", "fs"] }
tokio-util = { version = "0.7", default-features = false, features = ["compat", "io"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
mongodb = "3"
redis = { version = "1", default-features = false, features = ["tokio-comp", "tokio-native-tls-comp"] }
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
security-framework = "3"
# API requests: an HTTP client (HTTP/2, macOS TLS, proxies), WebSocket, scripts (QuickJS),
# JSONPath and JSON Schema for tests, hashes for Digest and AWS signatures.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "system-proxy", "charset", "multipart", "stream", "gzip", "brotli", "deflate", "zstd", "socks"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
rquickjs = "0.14"
serde_json_path = "0.7"
jsonschema = { version = "0.60", default-features = false }
sha2 = "0.11"
hmac = "0.13"
md-5 = "0.11"
fastrand = "2"
futures-util = "0.3"
anyhow = "1"
# Objective-C blocks (the successor of `block`, already built for GPUI).
block2 = "0.6"
futures = "0.3"
# GPUI snapshots from Zed (the `gpui` crate on crates.io stopped at 0.2.2), named `gpui` so imports stay
# `use gpui::*`. Pinned exactly: gpui-kit needs this same version, and snapshots break APIs.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["runtime_shaders"] }
gpui-kit = "=0.9.1"
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
# The one GPUI draws SVGs with: diagrams' text is turned into shapes with a font fallback that works.
usvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
mimalloc = "0.1.52"
# Big CSV files are read from disk as shown, not copied into memory.
memmap2 = "0.9"
# Word and Excel files are ZIPs of XML: inflated and read as they stream.
miniz_oxide = "0.8"
quick-xml = "0.41"
# PDF pages drawn by macOS go to the GPU as bitmaps (the same crates GPUI uses).
image = { version = "0.25", default-features = false }
smallvec = "1"
notify = "6"
objc = "0.2.7"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
ropey = "1.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "2"
trash = "5"
tree-sitter = "0.27"
tree-sitter-bash = "0.25.1"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-hcl = "1.1"
tree-sitter-highlight = "0.27"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
yaml-rust2 = "0.13.0"

# The objc crate's macros check `feature = "cargo-clippy"`, an old clippy convention.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
resvg = "0.45.1"
usvg = "0.45.1"
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["test-support"] }
